schema {
  query: RootQuery
  mutation: RootMutation
}

"""An app"""
type App implements Entity {
  """
  
              The app's ID.
          
  """
  id: ID

  """
  
              The app's name.
          
  """
  name: String
}

interface Entity {
  name: String
  id: ID
}

type RootMutation {
  """Creates a new user"""
  createUser(
    """The new user's name (1-64 characters after trimming)"""
    name: String!
  ): User!

  """Renames an existing user"""
  updateUserName(
    """The ID of the user to update"""
    id: ID!

    """The user's new name (1-64 characters after trimming)"""
    name: String!
  ): User!
}

type RootQuery {
  """The current viewer"""
  viewer: User

  """Look up a user by ID"""
  user(id: ID!): User
}

"""A user"""
type User implements Entity {
  """
  
              The user's ID.
          
  """
  id: ID

  """
  
              The user's name.
          
  """
  name: String

  """User's apps"""
  apps: [App]
}
