schema {
  query: RootQuery
  mutation: RootMutation
}

"""An app"""
type App implements Entity {
  """
  
              The app's ID.
          
  """
  id: ID

  """
  
              The app's name.
          
  """
  name: String
}

interface Entity {
  name: String
  id: ID
}

"""Relay pagination information"""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type RootMutation {
  """Creates a new user"""
  createUser(
    """The new user's name (1-64 characters after trimming)"""
    name: String!
  ): User!

  """Renames an existing user"""
  updateUserName(
    """The ID of the user to update"""
    id: ID!

    """The user's new name (1-64 characters after trimming)"""
    name: String!
  ): User!
}

type RootQuery {
  """The current viewer"""
  viewer: User

  """Look up a user by ID"""
  user(id: ID!): User

  """All users, ordered by ID, with Relay cursor pagination"""
  users(
    """Number of items to return (0-100, default 10)"""
    first: Int

    """Return items after this cursor"""
    after: String
  ): UserConnection!
}

"""A user"""
type User implements Entity {
  """
  
              The user's ID.
          
  """
  id: ID

  """
  
              The user's name.
          
  """
  name: String

  """User's apps"""
  apps: [App]
}

"""A Relay connection of User nodes"""
type UserConnection {
  edges: [UserEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

"""An edge in a User connection"""
type UserEdge {
  cursor: String!
  node: User
}
