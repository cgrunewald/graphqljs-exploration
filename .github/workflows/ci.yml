name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Check schema.graphql is up to date
        run: |
          npm run buildSchema
          git diff --exit-code schema.graphql || {
            echo "::error file=schema.graphql::schema.graphql is out of date. Run 'npm run buildSchema' and commit the result."
            exit 1
          }

      - name: Run tests
        # Skipped until a test suite exists under test/.
        if: hashFiles('test/**/*.test.ts') != ''
        run: npm test
